<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Calculator</title>
  <meta name="description" content="An interactive calculator for set operations: union, intersection, difference, symmetric difference and cartesian product." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__title">
        <span class="app-header__icon" aria-hidden="true">{ }</span>
        <div>
          <h1>Set Calculator</h1>
          <p class="app-header__subtitle">Union · Intersection · Difference · Symmetric Difference · Cartesian Product</p>
        </div>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <main class="layout">
      <section class="panel inputs-panel" aria-label="Set input">
        <div class="set-card set-card--a">
          <div class="set-card__header">
            <label for="setA">Set A</label>
            <button type="button" class="link-button" data-example="a">Example</button>
          </div>
          <textarea id="setA" rows="2" placeholder="e.g. 1, 2, 3, 4"></textarea>
          <div class="chips" id="setAChips" aria-live="polite"></div>
        </div>

        <div class="set-card set-card--b">
          <div class="set-card__header">
            <label for="setB">Set B</label>
            <button type="button" class="link-button" data-example="b">Example</button>
          </div>
          <textarea id="setB" rows="2" placeholder="e.g. 3, 4, 5, 6"></textarea>
          <div class="chips" id="setBChips" aria-live="polite"></div>
        </div>
      </section>

      <section class="panel operations-panel" aria-label="Set operations">
        <button type="button" class="op-button" data-op="union">
          <span class="op-button__symbol">A ∪ B</span>
          <span class="op-button__label">Union</span>
        </button>
        <button type="button" class="op-button" data-op="intersection">
          <span class="op-button__symbol">A ∩ B</span>
          <span class="op-button__label">Intersection</span>
        </button>
        <button type="button" class="op-button" data-op="differenceAB">
          <span class="op-button__symbol">A \ B</span>
          <span class="op-button__label">Difference</span>
        </button>
        <button type="button" class="op-button" data-op="differenceBA">
          <span class="op-button__symbol">B \ A</span>
          <span class="op-button__label">Difference</span>
        </button>
        <button type="button" class="op-button" data-op="symmetricDifference">
          <span class="op-button__symbol">A △ B</span>
          <span class="op-button__label">Symmetric Difference</span>
        </button>
        <button type="button" class="op-button" data-op="cartesianProduct">
          <span class="op-button__symbol">A × B</span>
          <span class="op-button__label">Cartesian Product</span>
        </button>
      </section>

      <section class="panel visual-panel" aria-label="Venn diagram">
        <svg id="vennDiagram" viewBox="0 0 400 300" role="img" aria-label="Venn diagram of the sets"></svg>
      </section>

      <section class="panel result-panel" aria-label="Result">
        <h2 id="resultTitle">The result will appear here</h2>
        <div class="chips chips--result" id="resultChips" aria-live="polite"></div>
        <table class="cartesian-table hidden" id="cartesianTable">
          <tbody id="cartesianTableBody"></tbody>
        </table>
        <button type="button" id="copyResult" class="link-button hidden">Copy result</button>
      </section>

      <section class="panel history-panel" aria-label="Calculation history">
        <h2>History</h2>
        <ul id="historyList" class="history-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Built with vanilla JavaScript, no external libraries.</p>
    </footer>
  </div>

  <script src="js/setOperations.js"></script>
  <script src="js/venn.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
